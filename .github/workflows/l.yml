name: Build and Update Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev

    - name: Clone Linux kernel source
      run: |
        git clone --depth 1 --branch v5.14 https://github.com/torvalds/linux.git
        cd linux

    - name: Apply updates to drivers
      run: |
        cd linux/drivers
        
        # Update driver1.c
        if [ -f "driver1.c" ]; then
          echo 'Updating driver1.c'
          sed -i '/printk(KERN_INFO "Driver1 initialized"/a printk(KERN_DEBUG "Driver1 debug info");' driver1.c
        fi

        # Update driver2.c
        if [ -f "driver2.c" ]; then
          echo 'Updating driver2.c'
          sed -i '/printk(KERN_INFO "Driver2 initialized"/a printk(KERN_DEBUG "Driver2 debug info");' driver2.c
        fi

        # Add more driver updates as needed
        if [ -f "example/example_driver.c" ]; then
          echo 'Updating example_driver.c'
          sed -i '/printk(KERN_INFO "Example driver initialized"/a printk(KERN_INFO "Simple driver change added");' example/example_driver.c
        fi

    - name: Copy existing config
      run: |
        cd linux
        cp ../arch/arm64/configs/your_device_defconfig .config

    - name: Build the kernel
      run: |
        cd linux
        make -j$(nproc)

    - name: Upload kernel build artifacts
      uses: actions/upload-artifact@v2
      with:
        name: kernel-build
        path: linux/arch/arm64/boot/Image.gz-dtb

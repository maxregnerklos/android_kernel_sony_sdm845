name: Cherry-Pick and Archive Upstream Commits

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cherry-pick-and-archive:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Clone upstream Linux kernel
      run: |
        git clone --depth 1 --branch v5.14 https://github.com/torvalds/linux.git upstream-linux

    - name: Clone local repository
      run: |
        git clone . local-repo

    - name: Cherry-pick compatible commits
      run: |
        # List of compatible commit hashes to cherry-pick
        COMPATIBLE_COMMITS=(
          "commit_hash_1"
          "commit_hash_2"
          "commit_hash_3"
        )

        cd upstream-linux

        # Add remote for local repo
        git remote add local ../local-repo
        git fetch local
        git checkout -b local-branch main

        # Cherry-pick each compatible commit
        for COMMIT in "${COMPATIBLE_COMMITS[@]}"; do
          git cherry-pick $COMMIT || {
            echo "Cherry-pick failed for commit $COMMIT. Exiting."
            exit 1
          }
        done

        # Copy the changes back to the local repository directory
        rsync -a --exclude=.git ./ ../local-repo/

        cd ../local-repo

    - name: Create zip archive
      run: |
        zip -r updated_kernel_files.zip *

    - name: Upload zip archive as artifact
      uses: actions/upload-artifact@v3
      with:
        name: updated-kernel-files
        path: updated_kernel_files.zip

name: Cherry-Pick Compatible Commits from Upstream Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Git configuration
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Create a new branch
      id: create_branch
      run: |
        NEW_BRANCH="upstream-cherry-pick-$(date +%Y%m%d%H%M%S)"
        echo "NEW_BRANCH=${NEW_BRANCH}" >> $GITHUB_ENV
        git checkout -b ${NEW_BRANCH}

    - name: Clone upstream Linux kernel
      run: |
        git clone --depth 1 --branch v5.14 https://github.com/torvalds/linux.git upstream-linux

    - name: Cherry-pick compatible commits
      run: |
        # List of compatible commit hashes to cherry-pick
        COMPATIBLE_COMMITS=(
          "commit_hash_1"
          "commit_hash_2"
          "commit_hash_3"
        )

        cd upstream-linux

        # Add remote for local repo
        git remote add local ../
        git fetch local
        git checkout -b local-branch local/${NEW_BRANCH}

        # Cherry-pick each compatible commit
        for COMMIT in "${COMPATIBLE_COMMITS[@]}"; do
          git cherry-pick $COMMIT || {
            echo "Cherry-pick failed for commit $COMMIT. Exiting."
            exit 1
          }
        done

        # Push changes to the local repo
        git push local local-branch:${NEW_BRANCH}

    - name: Push changes to new branch in the repository
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEW_BRANCH: ${{ env.NEW_BRANCH }}
      run: |
        git push --set-upstream origin ${NEW_BRANCH}

name: Update to Kernel 5.14

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Git configuration
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Create a new branch
      run: |
        NEW_BRANCH="update-to-5.14-$(date +%Y%m%d%H%M%S)"
        git checkout -b $NEW_BRANCH

    - name: Clone upstream Linux kernel
      run: |
        git clone --depth 1 --branch v5.14 https://github.com/torvalds/linux.git upstream-linux

    - name: Update driver files
      run: |
        # Copy driver files from upstream kernel
        cp -r upstream-linux/drivers/* drivers/

    - name: Update other necessary files
      run: |
        # Copy other necessary files from upstream kernel
        cp -r upstream-linux/include/* include/
        cp -r upstream-linux/arch/arm64/configs/* arch/arm64/configs/

    - name: Clean up
      run: |
        # Remove the cloned upstream kernel to save space
        rm -rf upstream-linux

    - name: Commit changes
      run: |
        git add .
        git commit -m "Update drivers and necessary files to kernel version 5.14"

    - name: Push changes to new branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git push origin HEAD:$NEW_BRANCH
